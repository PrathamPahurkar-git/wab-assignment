<form style="max-width: 600px; margin: 20px auto; padding: 25px; border: 1px solid #ccc; border-radius: 12px; font-family: Arial, sans-serif; background-color: #fcfcfc; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
  <h2 style="text-align: center; color: #222; margin-bottom: 25px; font-weight: 800;">Club Registration Form</h2>
  
  <!-- Personal Details Section - Vibrant Blue/Cyan Theme -->
  <fieldset style="border: 2px solid #00d2ff; border-radius: 8px; padding: 18px; margin-bottom: 20px; background-color: #e6f9ff;">
    <legend style="font-weight: bold; padding: 3px 12px; color: #fff; background-color: #0099ff; border-radius: 4px; font-size: 0.95em;">Personal Details</legend>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #005c8a;">Full Name:</label>
      <input type="text" style="width: 100%; padding: 8px; border: 1px solid #00d2ff; border-radius: 4px; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #005c8a;">Email Address:</label>
      <input type="email" style="width: 100%; padding: 8px; border: 1px solid #00d2ff; border-radius: 4px; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #005c8a;">Phone Number:</label>
      <input type="tel" style="width: 100%; padding: 8px; border: 1px solid #00d2ff; border-radius: 4px; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #005c8a;">Date Of Birth:</label>
      <input type="date" style="width: 100%; padding: 8px; border: 1px solid #00d2ff; border-radius: 4px; box-sizing: border-box;">
    </div>
    
    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #005c8a;">Gender:</label>
      <label style="margin-right: 15px; font-weight: normal;"><input type="radio" name="gender" value="Male" style="margin-right: 5px;">Male</label>
      <label style="margin-right: 15px; font-weight: normal;"><input type="radio" name="gender" value="Female" style="margin-right: 5px;">Female</label>
      <label style="font-weight: normal;"><input type="radio" name="gender" value="Other" style="margin-right: 5px;">Other</label>
    </div>
  </fieldset>

  <!-- Academic Details Section - Vibrant Purple/Pink Theme -->
  <fieldset style="border: 2px solid #e040fb; border-radius: 8px; padding: 18px; margin-bottom: 20px; background-color: #fae6ff;">
    <legend style="font-weight: bold; padding: 3px 12px; color: #fff; background-color: #d500f9; border-radius: 4px; font-size: 0.95em;">Academic Details</legend>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #7b0099;">Department:</label>
      <select style="width: 100%; padding: 8px; border: 1px solid #e040fb; border-radius: 4px; box-sizing: border-box; background-color: #fff;">
        <option value="">-- Select Department --</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Mechanical Engineering">Mechanical Engineering</option>
        <option value="Civil Engineering">Civil Engineering</option>
        <option value="Artificial Intelligence and Machine Learning (AI-ML)">Artificial Intelligence and Machine Learning (AI-ML)</option>
        <option value="Cybersecurity Engineering">Cybersecurity Engineering</option>
        <option value="Robotics and Automation">Robotics and Automation</option>
        <option value="Chemical Engineering">Chemical Engineering</option>
      </select>
    </div>
    
    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #7b0099;">Year of Study:</label>
      <select style="width: 100%; padding: 8px; border: 1px solid #e040fb; border-radius: 4px; box-sizing: border-box; background-color: #fff;">
        <option value="">-- Select Year --</option>
        <option value="1st Year">1st Year</option>
        <option value="2nd Year">2nd Year</option>
        <option value="3rd Year">3rd Year</option>
        <option value="4th Year">4th Year</option>
      </select>
    </div>
  </fieldset>

  <!-- Club Preference Section - Vibrant Orange/Amber Theme -->
  <fieldset style="border: 2px solid #ff9100; border-radius: 8px; padding: 18px; margin-bottom: 20px; background-color: #fff3e0;">
    <legend style="font-weight: bold; padding: 3px 12px; color: #fff; background-color: #ff6d00; border-radius: 4px; font-size: 0.95em;">Club Preference</legend>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #b24b00;">Select Club:</label>
      <select style="width: 100%; padding: 8px; border: 1px solid #ff9100; border-radius: 4px; box-sizing: border-box; background-color: #fff;">
        <option value="">-- Select Club --</option>
        <option value="coding club">Coding Club</option>
        <option value="Sorts club">Sports Club</option>
        <option value="Music club">Music Club</option>
      </select>
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #b24b00;">Areas of Interest (choose all that apply):</label>
      <label style="display: block; margin-bottom: 5px; font-weight: normal;"><input type="checkbox" name="interest" value="Event Management" style="margin-right: 8px;">Event Management</label>
      <label style="display: block; margin-bottom: 5px; font-weight: normal;"><input type="checkbox" name="interest" value="Design/Creative" style="margin-right: 8px;">Design/Creative</label>
      <label style="display: block; font-weight: normal;"><input type="checkbox" name="interest" value="Technical Work" style="margin-right: 8px;">Technical Work</label>
    </div>
    
    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #b24b00;">Why do you want to join?</label>
      <textarea rows="4" style="width: 100%; padding: 8px; border: 1px solid #ff9100; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
    </div>
  </fieldset>

  <!-- Photo Upload & Agreement - Vibrant Lime/Green Theme -->
  <fieldset style="border: 2px solid #00e676; border-radius: 8px; padding: 18px; margin-bottom: 25px; background-color: #e8f5e9;">
    <legend style="font-weight: bold; padding: 3px 12px; color: #fff; background-color: #00c853; border-radius: 4px; font-size: 0.95em;">Submission</legend>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #006000;">Upload Passport Photo:</label>
      <input type="file" style="display: block;">
    </div>
    
    <div>
      <label style="font-weight: normal; color: #006000;"><input type="checkbox" required style="margin-right: 8px;">I agree to the club's terms and conditions</label>
    </div>
  </fieldset>
  
  <!-- Form Actions -->
  <div style="display: flex; gap: 12px;">
    <button type="submit" style="flex: 1; padding: 12px; background-color: #ff1744; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1em; cursor: pointer; box-shadow: 0 4px 6px rgba(255,23,68,0.2);">Save Form</button>
    <button type="reset" style="padding: 12px 24px; background-color: #37474f; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1em; cursor: pointer;">Clear Form</button>
  </div>
</form>
